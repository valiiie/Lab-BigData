lab_medallion:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: lab_medallion.duckdb
      threads: 4
      settings:
        TimeZone: UTC
        s3_endpoint: "s3.seaweedfs.adm.adaltas.cloud"
        s3_url_style: "path"
        s3_use_ssl: true
        s3_access_key_id: "{{ env_var('AWS_ACCESS_KEY_ID') }}"
        s3_secret_access_key: "{{ env_var('AWS_SECRET_ACCESS_KEY') }}"
        s3_session_token: "{{ env_var('AWS_SESSION_TOKEN', '') }}"
